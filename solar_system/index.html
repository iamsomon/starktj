<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#081211">
    <meta name="description" content="Интерактивный атлас Солнечной системы. Восемь планет, трёхмерные орбиты и путешествия во времени.">
    <link rel="icon" type="image/png" href="./media/icon.png">
    <title>Stark Eyes — Солнечная система</title>
    <script type="module" crossorigin src="./assets/index-C-fJcT1T.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/view-0FWCM4vx.js">
    <link rel="stylesheet" crossorigin href="./assets/index--qziCw-O.css">
  </head>
  <body>
    <div id="app">
      <header class="masthead">
        <div class="brand">
          <div class="brand-icon" aria-hidden="true"><span></span></div>
          <div><h1 class="wordmark">STARK<span> EYES</span></h1><p data-text="subtitle"></p></div>
        </div>
        <div class="header-actions">
          <button id="now" class="live" type="button" data-tip="liveTip"><span class="live-dot"></span><span id="live-label"></span></button>
          <span class="header-divider"></span>
          <button id="language" class="icon-button lang" type="button" data-tip="language"></button>
          <button id="about" class="icon-button" type="button" data-tip="about"><i data-lucide="info"></i></button>
        </div>
      </header>

      <main class="dashboard">
        <aside class="sidebar" aria-labelledby="objects-heading">
          <p class="atlas-title" data-text="title"></p>
          <h2 class="panel-heading" id="objects-heading"><i data-lucide="orbit"></i><span data-text="objects"></span></h2>
          <div class="object-list" id="objects"></div>
        </aside>

        <section class="stage" id="stage" data-label="map">
          <div id="scene" class="scene"></div>
          <div id="orbit-events" class="orbit-events" role="group" data-label="orbitEvents"></div>
          <div id="map-labels" class="map-labels"></div>
          <div id="belt-labels" class="belt-labels" aria-hidden="true"></div>
          <div class="view-controls">
            <div class="segment" data-label="views" role="group">
              <button id="perspective" type="button" aria-pressed="true"><i data-lucide="box"></i><span>3D</span></button>
              <button id="top-view" type="button" aria-pressed="false"><i data-lucide="map"></i><span data-text="top"></span></button>
            </div>
            <button id="mobile-objects" class="map-button mobile-objects" type="button" data-tip="objects"><i data-lucide="list"></i></button>
          </div>
          <div id="belt-controls" class="belt-controls" role="group" data-label="beltViews"></div>
          <div id="stage-actions" class="stage-actions">
            <button id="fullscreen" class="map-button" type="button" aria-pressed="false"><i data-lucide="maximize"></i><i data-lucide="minimize"></i></button>
          </div>
          <aside id="event-spotlight" class="event-spotlight" hidden>
            <div class="event-spotlight-head">
              <p id="spotlight-kind"></p>
              <button id="clear-event" class="icon-button" type="button" data-tip="close"><i data-lucide="x"></i></button>
            </div>
            <h3 id="spotlight-title"></h3>
            <p id="spotlight-date"></p>
            <p id="spotlight-countdown" class="spotlight-countdown"></p>
            <div id="event-current" class="event-current" hidden>
              <div id="event-angle" class="event-angle" aria-hidden="true"><i></i><i></i></div>
              <p id="event-value"></p>
            </div>
            <div class="spotlight-actions">
              <button id="event-play" class="event-play" type="button"><i data-lucide="rewind"></i><span data-text="playBefore"></span></button>
              <button id="event-jump" class="event-jump" type="button"><span data-text="jumpEvent"></span></button>
            </div>
          </aside>
          <div class="camera-controls" role="group" data-label="camera">
            <button id="zoom-in" class="map-button" type="button" data-tip="zoomIn"><i data-lucide="plus"></i></button>
            <button id="zoom-out" class="map-button" type="button" data-tip="zoomOut"><i data-lucide="minus"></i></button>
            <button id="overview" class="map-button reset-button" type="button" data-tip="overview"><i data-lucide="locate-fixed"></i></button>
          </div>
          <div class="map-footer">
            <div class="map-legend">
              <p id="scale-note" data-text="scale"></p>
              <p class="orbit-legend"><span aria-hidden="true"></span><span data-text="orbitEvents"></span></p>
            </div>
            <p id="gesture-note"></p>
          </div>
        </section>

        <aside id="inspector" class="inspector" aria-labelledby="body-name">
          <div class="portrait">
            <div class="portrait-grid" aria-hidden="true"></div>
            <div id="body-tag" class="body-tag"><span></span><span id="body-type"></span></div>
            <img id="body-image" width="420" height="420" alt="">
          </div>
          <div class="inspector-content">
            <h2 id="body-name"></h2>
            <p id="body-description"></p>
            <dl class="metrics">
              <div><dt><i data-lucide="ruler"></i><span data-text="diameter"></span></dt><dd id="diameter"></dd></div>
              <div><dt><i data-lucide="sun"></i><span data-text="distance"></span></dt><dd id="distance"></dd></div>
              <div><dt><i data-lucide="timer"></i><span data-text="period"></span></dt><dd id="period"></dd></div>
            </dl>
            <button id="focus" class="focus-button" type="button"><i data-lucide="crosshair"></i><span id="focus-label"></span></button>
          </div>
        </aside>

        <section class="timeline" aria-labelledby="time-heading">
          <div class="time-actions">
            <h2 id="time-heading" class="panel-heading"><i data-lucide="clock-3"></i><span data-text="time"></span></h2>
            <div class="play-controls">
              <button id="play" class="icon-button play" type="button"><i data-lucide="play"></i><i data-lucide="pause"></i></button>
              <div class="speed-control"><select id="speed" data-label="speed"></select><i data-lucide="chevron-down"></i></div>
            </div>
          </div>
          <div class="time-track">
            <label for="timeline-range" class="time-track-label"><span id="track-year"></span><span id="track-month"></span></label>
            <div id="track" class="track">
              <div id="season-markers" class="season-markers"></div>
              <input id="timeline-range" type="range" min="0" step="1" value="0">
            </div>
            <div id="month-ticks" class="month-ticks" aria-hidden="true"></div>
          </div>
          <div class="date-actions">
          <button id="events" class="date-control events-control" type="button" data-tip="events"><i data-lucide="calendar-range"></i><span data-text="events"></span></button>
          <button id="date" class="date-control" type="button" data-tip="dateTip"><i data-lucide="calendar-days"></i><span><strong id="date-day"></strong><span id="date-clock"></span></span></button>
          </div>
        </section>
      </main>
    </div>

    <dialog id="date-dialog" class="dialog" aria-labelledby="date-heading">
      <form id="date-form" class="dialog-content">
        <div class="dialog-header"><h2 id="date-heading" data-text="dateTip"></h2><button class="icon-button" type="button" data-close data-tip="close"><i data-lucide="x"></i></button></div>
        <p data-text="dateRange"></p>
        <label for="date-input" data-text="dateInput"></label>
        <input id="date-input" name="date" type="datetime-local" min="1900-01-01T00:00" max="2100-12-31T23:59" required>
        <button class="focus-button" type="submit"><i data-lucide="calendar-days"></i><span data-text="apply"></span></button>
      </form>
    </dialog>

    <dialog id="objects-dialog" class="dialog" aria-labelledby="objects-dialog-heading">
      <div class="dialog-content">
        <div class="dialog-header"><h2 id="objects-dialog-heading" data-text="objects"></h2><button class="icon-button" type="button" data-close data-tip="close"><i data-lucide="x"></i></button></div>
        <div class="object-list" id="mobile-list"></div>
      </div>
    </dialog>

    <dialog id="events-dialog" class="dialog events-dialog" aria-labelledby="events-heading">
      <div class="dialog-content">
        <div class="dialog-header"><h2 id="events-heading" data-text="eventsTitle"></h2><button class="icon-button" type="button" data-close data-tip="close"><i data-lucide="x"></i></button></div>
        <div class="event-browser-controls">
          <div class="event-year" data-label="eventYear" role="group">
            <button id="prev-year" class="icon-button" type="button" data-tip="prevYear"><i data-lucide="chevron-left"></i></button>
            <input id="event-year" type="number" min="1900" max="2100" step="1" data-label="eventYear">
            <button id="next-year" class="icon-button" type="button" data-tip="nextYear"><i data-lucide="chevron-right"></i></button>
          </div>
          <div id="event-filters" class="event-filters" role="group" data-label="eventFilter">
            <button type="button" data-filter="all" data-text="allEvents" aria-pressed="true"></button>
            <button type="button" data-filter="seasons" data-text="seasons" aria-pressed="false"></button>
            <button type="button" data-filter="approaches" data-text="approaches" aria-pressed="false"></button>
            <button type="button" data-filter="eclipses" data-text="eclipses" aria-pressed="false"></button>
          </div>
        </div>
        <div id="event-list" class="event-list"></div>
      </div>
    </dialog>

    <dialog id="about-dialog" class="dialog" aria-labelledby="about-heading">
      <div class="dialog-content">
        <div class="dialog-header"><h2 id="about-heading" data-text="about"></h2><button class="icon-button" type="button" data-close data-tip="close"><i data-lucide="x"></i></button></div>
        <p data-text="aboutModel"></p>
        <p data-text="aboutScale"></p>
        <p data-text="aboutLighting"></p>
        <p data-text="aboutEvents"></p>
        <div class="credits">
          <a href="https://github.com/cosinekitty/astronomy" target="_blank" rel="noopener">Astronomy Engine</a>
          <a href="https://www.solarsystemscope.com/textures/" target="_blank" rel="noopener">Solar System Scope</a>
          <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0</a>
          <a href="https://science.nasa.gov/solar-system/kuiper-belt/facts/" target="_blank" rel="noopener">NASA Kuiper Belt</a>
          <a href="https://science.nasa.gov/solar-system/planets/planet-sizes-and-locations-in-our-solar-system/" target="_blank" rel="noopener">NASA Science</a>
          <a href="https://science.nasa.gov/photojournal/pluto-in-extended-color/" id="pluto-credit" target="_blank" rel="noopener">NASA/JPL</a>
        </div>
      </div>
    </dialog>
    <noscript><p>Включите JavaScript, чтобы открыть карту. Enable JavaScript to open the map.</p></noscript>
  </body>
</html>
