
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
    <script src="https://unpkg.com/feather-icons"></script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.7.0/lib/core.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.7.0/styles/github.min.css">
<style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            overflow: hidden;
        }
        
        .download-btn {
            background: linear-gradient(45deg, #667eea, #764ba2);
            box-shadow: 0 20px 40px rgba(102, 126, 234, 0.3);
            transition: all 0.3s ease;
            border: none;
            position: relative;
            overflow: hidden;
        }
        
        .download-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 25px 50px rgba(102, 126, 234, 0.4);
        }
        
        .download-btn:active {
            transform: translateY(-1px);
        }
        
        .download-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }
        
        .download-btn:hover::before {
            left: 100%;
        }
        
        .floating-shapes {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: -1;
        }
        
        .shape {
            position: absolute;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            animation: float 6s ease-in-out infinite;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(180deg); }
        }
    </style>
</head>
<body class="min-h-screen bg-gray-50">
    <!-- Download button top right -->
    <div class="absolute top-4 right-4">
        <a href="an.exe" download class="inline-flex items-center px-4 py-2 bg-indigo-600 text-white rounded-lg shadow hover:bg-indigo-700 transition">
            <i data-feather="download" class="w-4 h-4 mr-2"></i>
            Скачать
        </a>
    </div>

    <!-- Chat container -->
    <div class="container mx-auto max-w-4xl px-4 py-20">
        <div class="bg-white rounded-xl shadow-lg overflow-hidden">
            <!-- Chat header -->
            <div class="bg-indigo-600 text-white p-4">
                <h1 class="text-xl font-semibold">Заметки</h1>
            </div>
            
            <!-- Messages container -->
            <div id="messages" class="h-[70vh] overflow-y-auto p-4 space-y-4"></div>
            
            <!-- Input area -->
            <div class="border-t p-4 bg-gray-50">
                <div class="flex space-x-2 mb-2">
                    <button id="codeBtn" class="px-3 py-1 bg-gray-200 rounded text-sm hover:bg-gray-300">Код</button>
                </div>
                <div class="flex space-x-2">
                    <input id="messageInput" type="text" placeholder="Заметка..." 
                        class="flex-1 p-2 border rounded focus:outline-none focus:ring-2 focus:ring-indigo-400">
                    <button id="sendBtn" class="px-4 py-2 bg-indigo-600 text-white rounded hover:bg-indigo-700">Отправить</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Code modal -->
    <div id="codeModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center">
        <div class="bg-white rounded-lg p-6 max-w-2xl w-full">
            <h2 class="text-xl font-semibold mb-4">Добавить код</h2>
            <textarea id="codeInput" class="w-full h-64 p-2 border rounded font-mono text-sm" 
                placeholder="Paste your code here..."></textarea>
            <div class="flex justify-end space-x-2 mt-4">
                <button id="cancelCode" class="px-4 py-2 border rounded">Отмена</button>
                <button id="insertCode" class="px-4 py-2 bg-indigo-600 text-white rounded">Добавить</button>
            </div>
        </div>
    </div>
    <script>
        feather.replace();
        
        // Google Sheets API configuration
        // INSTRUCTIONS: Replace these values with your own
        // 1. Create a Google Sheet and share it publicly (Anyone with the link can view)
        // 2. Get the sheet ID from the URL (between /d/ and /edit)
        // 3. Replace SHEET_ID below
        // 4. The sheet should have columns: Timestamp, Message, IsCode
        const SHEET_ID = '1qMWzsSa9xmqXNF-mHst7V46ltcSQuW1742B1IQYbw1c';
        const API_KEY = 'AIzaSyDzkaC-3Hx0CXPQIsnkYxlVbDPOAcKZ5DU';
        const SHEET_NAME = 'Chat'; // Change if your sheet has a different name

        // DOM elements
        const messagesContainer = document.getElementById('messages');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const codeBtn = document.getElementById('codeBtn');
        const codeModal = document.getElementById('codeModal');
        const codeInput = document.getElementById('codeInput');
        const insertCodeBtn = document.getElementById('insertCode');
        const cancelCodeBtn = document.getElementById('cancelCode');

        // Load messages from Google Sheets
        async function loadMessages() {
            try {
                const url = `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${SHEET_NAME}?key=${API_KEY}`;
                const response = await fetch(url);
                const data = await response.json();
                
                messagesContainer.innerHTML = '';
                
                if (data.values && data.values.length > 1) {
                    // Skip header row
                    data.values.slice(1).forEach(row => {
                        const [timestamp, message, isCode] = row;
                        addMessageToUI(message, isCode === 'TRUE', timestamp);
                    });
                }
            } catch (error) {
                console.error('Error loading messages:', error);
            }
        }

        // Add message to UI
        function addMessageToUI(message, isCode, timestamp = new Date().toLocaleString()) {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'bg-gray-100 p-3 rounded-lg';
            
            if (isCode) {
                messageDiv.innerHTML = `
                    <div class="text-xs text-gray-500 mb-1">${timestamp}</div>
                    <pre class="bg-gray-800 text-gray-100 p-3 rounded overflow-x-auto"><code>${message}</code></pre>
                    <button class="copy-btn mt-2 text-gray-500 hover:text-indigo-600" data-content="${escapeHtml(message)}">
                        <i data-feather="copy" class="w-4 h-4"></i>
                    </button>
                `;
            } else {
                messageDiv.innerHTML = `
                    <div class="text-xs text-gray-500 mb-1">${timestamp}</div>
                    <div class="whitespace-pre-wrap">${message}</div>
                    <button class="copy-btn mt-2 text-gray-500 hover:text-indigo-600" data-content="${escapeHtml(message)}">
                        <i data-feather="copy" class="w-4 h-4"></i>
                    </button>
                `;
            }
            
            messagesContainer.appendChild(messageDiv);
            feather.replace();
            
            // Scroll to bottom
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
            
            // Add copy functionality
            const copyBtns = document.querySelectorAll('.copy-btn');
            copyBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    const content = btn.getAttribute('data-content');
                    navigator.clipboard.writeText(content);
                    
                    // Show copied feedback
                    const icon = btn.querySelector('i');
                    icon.setAttribute('data-feather', 'check');
                    feather.replace();
                    
                    setTimeout(() => {
                        icon.setAttribute('data-feather', 'copy');
                        feather.replace();
                    }, 1000);
                });
            });
        }

        // Escape HTML for safe display
        function escapeHtml(unsafe) {
            return unsafe
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            loadMessages();
            
            // Send message
            sendBtn.addEventListener('click', sendMessage);
            messageInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') sendMessage();
            });
            
            // Code modal
            codeBtn.addEventListener('click', () => {
                codeModal.classList.remove('hidden');
                codeModal.classList.add('flex');
                codeInput.focus();
            });
            
            cancelCodeBtn.addEventListener('click', () => {
                codeModal.classList.add('hidden');
                codeModal.classList.remove('flex');
                codeInput.value = '';
            });
            
            insertCodeBtn.addEventListener('click', () => {
                const code = codeInput.value.trim();
                if (code) {
                    addMessageToUI(code, true);
                    // Here you would also send to Google Sheets
                }
                codeInput.value = '';
                codeModal.classList.add('hidden');
                codeModal.classList.remove('flex');
            });
        });
        
        function sendMessage() {
            const message = messageInput.value.trim();
            if (message) {
                addMessageToUI(message, false);
                // Here you would also send to Google Sheets
                messageInput.value = '';
            }
        }
    </script>
</body>
</html>
