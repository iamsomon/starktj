<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Stark Calendar · Render</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      font-family: "Manrope", "Avenir Next", "Segoe UI", "SF Pro Display", sans-serif;
      background: #000;
      color: #f5f7fb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #02040a;
    }

    canvas {
      max-width: 100vw;
      max-height: 100vh;
      width: auto;
      height: auto;
      display: block;
    }

    noscript {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.8);
      padding: 12px 16px;
      border-radius: 999px;
      font-size: 0.9rem;
      color: #fff;
    }
  </style>
</head>
<body>
  <noscript>JavaScript is required to render the wallpaper.</noscript>
  <script src="wallpaper.js"></script>
  <script>
    (() => {
      if (!window.StarkWallpaper || typeof window.StarkWallpaper.drawWallpaper !== 'function') {
        console.error('StarkWallpaper renderer is unavailable.');
        return;
      }

      const { drawWallpaper } = window.StarkWallpaper;

      const params = new URLSearchParams(window.location.search);

      const detectDefaults = () => {
        const ua = navigator.userAgent || '';
        let platform = 'Desktop';
        if (/iPad|iPhone|iPod/.test(ua)) platform = 'iOS';
        else if (/Android/.test(ua)) platform = 'Android';

        const { width, height } = window.screen;
        const dpr = window.devicePixelRatio || 1;

        const prefersLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;

        const language = (navigator.language || 'en').startsWith('ru') ? 'ru' : 'en';

        return {
          platform,
          width: Math.round(width * dpr),
          height: Math.round(height * dpr),
          theme: prefersLight ? 'light' : 'dark',
          lang: language,
          months: '1'
        };
      };

      const parseDimension = (raw, fallback) => {
        const numeric = Number(raw);
        if (Number.isFinite(numeric) && numeric >= 320 && numeric <= 8000) {
          return Math.round(numeric);
        }
        return fallback;
      };

      const getConfig = () => {
        const defaults = detectDefaults();
        const themeParam = params.get('theme');
        const resolvedTheme = themeParam === 'light' ? 'light' : themeParam === 'dark' ? 'dark' : defaults.theme;

        const langParam = params.get('lang');
        const monthsParam = params.get('months');

        return {
          platform: params.get('platform') || defaults.platform,
          width: parseDimension(params.get('width'), defaults.width),
          height: parseDimension(params.get('height'), defaults.height),
          theme: resolvedTheme,
          lang: langParam === 'ru' ? 'ru' : 'en',
          months: ['6', '12'].includes(monthsParam) ? monthsParam : '1',
          colors: {
            accent: params.get('accent') || undefined,
            gradientStart: params.get('gradStart') || undefined,
            gradientEnd: params.get('gradEnd') || undefined,
            textPrimary: params.get('textPrimary') || undefined,
            textSecondary: params.get('textSecondary') || undefined
          }
        };
      };

      const createCanvas = (config) => {
        const canvas = document.createElement('canvas');
        canvas.width = config.width;
        canvas.height = config.height;
        const scalePreview = Math.min(window.innerWidth / config.width, window.innerHeight / config.height, 1);
        canvas.style.width = `${config.width * scalePreview}px`;
        canvas.style.height = `${config.height * scalePreview}px`;
        document.body.appendChild(canvas);
        return canvas;
      };

      const exportIfRequested = (canvas) => {
        const format = (params.get('format') || '').toLowerCase();
        if (!format) return;
        const useJpeg = format === 'jpg' || format === 'jpeg';
        const mime = useJpeg ? 'image/jpeg' : 'image/png';
        const quality = useJpeg ? 0.92 : 1;
        canvas.toBlob((blob) => {
          if (!blob) return;
          const objectUrl = URL.createObjectURL(blob);
          const shouldDownload = params.get('download') === '1';
          if (shouldDownload) {
            const link = document.createElement('a');
            link.href = objectUrl;
            link.download = `stark-calendar.${useJpeg ? 'jpg' : 'png'}`;
            link.click();
            setTimeout(() => URL.revokeObjectURL(objectUrl), 1200);
            return;
          }
          document.body.innerHTML = '';
          const img = document.createElement('img');
          img.src = objectUrl;
          img.alt = 'Stark Calendar';
          img.style.maxWidth = '100vw';
          img.style.maxHeight = '100vh';
          img.style.width = 'auto';
          img.style.height = 'auto';
          img.style.display = 'block';
          img.addEventListener('load', () => {
            setTimeout(() => URL.revokeObjectURL(objectUrl), 1200);
          });
          document.body.appendChild(img);
        }, mime, quality);
      };

      const init = () => {
        const config = getConfig();
        const canvas = createCanvas(config);
        drawWallpaper(canvas, {
          platform: config.platform,
          theme: config.theme,
          colors: config.colors,
          monthsMode: config.months,
          lang: config.lang
        });
        exportIfRequested(canvas);
      };

      const run = () => {
        if (document.fonts && document.fonts.ready) {
          document.fonts.ready.then(init).catch(init);
        } else {
          init();
        }
      };

      if (document.readyState === 'complete' || document.readyState === 'interactive') {
        run();
      } else {
        document.addEventListener('DOMContentLoaded', run);
      }
    })();
  </script>
</body>
</html>
